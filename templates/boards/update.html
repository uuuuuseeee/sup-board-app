    {% extends 'base.html' %}

    {% block title %}ボード情報の更新{% endblock %}
    {% block header %}「{{ board.name }}」の情報を更新{% endblock %}

    {% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form action="{{ url_for('boards.update', board_id=board.id) }}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">ボード名</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ board.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="serial_number" class="form-label">シリアル番号 (任意)</label>
                            <input type="text" class="form-control" id="serial_number" name="serial_number" value="{{ board.serial_number or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">現在の場所</label>
                            <p class="form-control-plaintext">{{ board.location }}</p>
                            <small class="text-muted">※ 場所の変更は<a href="{{ url_for('transports.new') }}?board_id={{ board.id }}">運搬登録</a>から行ってください。</small>
                        </div>
                        <div class="mb-3">
                            <label for="notes" class="form-label">備考</label>
                            <textarea name="notes" id="notes" class="form-control" rows="3">{{ board.notes or '' }}</textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">更新する</button>
                            <a href="{{ url_for('transports.board_history', board_id=board.id) }}" class="btn btn-info">運搬履歴を見る</a>
                            <a href="{{ url_for('boards.index') }}" class="btn btn-secondary">一覧に戻る</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endblock %}
